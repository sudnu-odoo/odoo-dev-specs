# Every push and pull request: format, lint, unit and integration tests (make check).
# Every push to main (or master) that passes: the next version is released automatically
# (.deb on the Releases page, which the app's updater reads).
#
# Version bump: patch by default (0.1.4 -> 0.1.5). Put [minor] or [major]
# in a commit message to bump those instead.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# One release at a time, so two pushes can't claim the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # What Tauri needs to build on Ubuntu.
  TAURI_DEPS: libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev libayatana-appindicator3-dev patchelf

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_DEPS

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm --prefix ui ci

      # Format, lint, Rust and UI tests; the browser tests use the runner's Chrome.
      - run: make check

      # The UI's types are generated from Rust: the committed ones must be current.
      - name: Generated TypeScript types are up to date
        run: |
          git add -N ui/src/lib/bindings
          git diff --exit-code -- ui/src/lib/bindings || {
            echo "Run 'make bindings' and commit ui/src/lib/bindings."; exit 1; }

  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    # Built on the oldest Ubuntu we support: a program built on 22.04 also runs
    # on 24.04, never the other way round.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the tag and the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags and history, for the version and notes

      - name: Next version and release notes
        id: version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          if [ -n "$last" ]; then range="$last..HEAD"; else range="HEAD"; fi
          if [ -z "$(git log --format=%H $range)" ]; then
            echo "Nothing new since $last"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$last" ]; then
            # The first release is the version in Cargo.toml.
            version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            messages=$(git log --format=%B $range)
            if grep -q '\[major\]' <<< "$messages"; then
              major=$((major + 1)); minor=0; patch=0
            elif grep -q '\[minor\]' <<< "$messages"; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Commit titles since the last release: the app shows these as
          # "What's new" before updating.
          git log --no-merges --format='- %s' $range > notes.md
          echo "Releasing $version"; cat notes.md

      - name: System packages
        if: steps.version.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y $TAURI_DEPS

      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build the package
        if: steps.version.outputs.skip != 'true'
        env:
          # Stamped into the app, so its updater knows which version it is.
          SPECS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm --prefix ui ci
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build --bundles deb --config "{\"version\":\"$SPECS_VERSION\"}"
          # One name without spaces: odoo-dev-specs_<version>_amd64.deb
          mkdir -p dist
          cp target/release/bundle/deb/*.deb "dist/odoo-dev-specs_${SPECS_VERSION}_amd64.deb"

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Odoo Dev Specs ${{ steps.version.outputs.version }}
          body_path: notes.md
          files: dist/*.deb
