[workspace]
resolver = "2"
members = ["crates/odoo-runtime", "crates/specs-core", "crates/excalidraw", "crates/specs-mcp", "src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"
repository = "https://github.com/sudnu-odoo/odoo-dev-specs"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tempfile = "3"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
# TypeScript types for the UI, generated from the Rust ones (see .cargo/config.toml).
ts-rs = { version = "12", features = ["no-serde-warnings", "serde-json-impl"] }
